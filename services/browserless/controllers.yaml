---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: browserless
    app.kubernetes.io/name: browserless
    app.kubernetes.io/part-of: services
  name: browserless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: browserless
      app.kubernetes.io/name: browserless
      app.kubernetes.io/part-of: services
  template:
    metadata:
      labels:
        app.kubernetes.io/component: browserless
        app.kubernetes.io/name: browserless
        app.kubernetes.io/part-of: services
    spec:
      automountServiceAccountToken: false
      containers:
      - name: browserless
        image: browserless/browserless:latest
        command:
        - /bin/bash
        - -c
        - |
          rm -f /tmp/.X99-lock
          Xvfb :99 -noreset -screen 0 1920x1080x24 -nolisten tcp -nolisten unix >/dev/null &
          export DISPLAY=:99
          exec ./scripts/start.sh
        env:
        - name: TIMEOUT
          value: '120000'
        - name: TZ
          value: Asia/Taipei
        envFrom:
        - secretRef:
            name: browserless
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          limits:
            cpu: 2000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 512Mi
      enableServiceLinks: false
      serviceAccountName: default
