---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: browserless
    app.kubernetes.io/name: browserless
    app.kubernetes.io/part-of: services
  name: browserless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: browserless
      app.kubernetes.io/name: browserless
      app.kubernetes.io/part-of: services
  template:
    metadata:
      labels:
        app.kubernetes.io/component: browserless
        app.kubernetes.io/name: browserless
        app.kubernetes.io/part-of: services
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      automountServiceAccountToken: false
      containers:
      - name: browserless
        image: browserless/browserless:latest
        command:
        - /bin/bash
        - -c
        - |
          rm -f /tmp/.X99-lock
          Xvfb :99 -noreset -screen 0 1920x1080x24 -nolisten tcp -nolisten unix >/dev/null &
          export DISPLAY=:99
          exec ./scripts/start.sh
        env:
        - name: TIMEOUT
          value: '120000'
        - name: TZ
          value: Asia/Taipei
        envFrom:
        - secretRef:
            name: browserless
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          limits:
            cpu: 2000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: extensions
          mountPath: /opt/browserless/extensions
          readOnly: true
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: extensions
        configMap:
          name: browserless
          items:
          - key: webgl-manifest.json
            path: webgl/manifest.json
          - key: webgl-spoof.js
            path: webgl/spoof.js
