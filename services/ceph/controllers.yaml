---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: radosgw
    app.kubernetes.io/name: ceph
    app.kubernetes.io/part-of: services
  name: ceph-radosgw
spec:
  replicas: 1
  minReadySeconds: 15
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: radosgw
      app.kubernetes.io/name: ceph
      app.kubernetes.io/part-of: services
  template:
    metadata:
      labels:
        app.kubernetes.io/component: radosgw
        app.kubernetes.io/name: ceph
        app.kubernetes.io/part-of: services
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ceph.kubernetes.progamesigner.dev/radosgw
                operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                - radosgw
              - key: app.kubernetes.io/name
                operator: In
                values:
                - ceph
              - key: app.kubernetes.io/part-of
                operator: In
                values:
                - services
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: tls
        image: ceph/ceph:latest
        command:
        - sh
        - -c
        - |
          set -eu;
          umask 077;

          while :; do
            if [ -n "$TLS_CONTENT_SHA256" ] && cp /mnt/ceph-tls/tls.crt /etc/ceph-tls/tls.crt.next && cp /mnt/ceph-tls/tls.key /etc/ceph-tls/tls.key.next; then
              actual=$(cat /etc/ceph-tls/tls.crt.next /etc/ceph-tls/tls.key.next | sha256sum | cut -d ' ' -f 1);
              [ "$actual" != "$TLS_CONTENT_SHA256" ] || break;
            fi
            sleep 5;
          done;
          mv /etc/ceph-tls/tls.crt.next /etc/ceph-tls/tls.crt;
          mv /etc/ceph-tls/tls.key.next /etc/ceph-tls/tls.key;
          chown 167:167 /etc/ceph-tls/tls.crt /etc/ceph-tls/tls.key;
          printf '%s\n' "$actual" > /etc/ceph-tls/content.sha256;
        env:
        - name: TLS_CONTENT_SHA256
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['tls.progamesigner.dev/content-sha256']
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
        volumeMounts:
        - name: tls
          mountPath: /mnt/ceph-tls
          readOnly: true
        - name: certs
          mountPath: /etc/ceph-tls
      - name: chown
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          set -ex;

          cp -LRv /mnt/ceph/*.keyring /etc/ceph/;
          cp -LRv /mnt/ceph-conf/ceph.conf /etc/ceph/ceph.conf;

          chown -R 167:167 /etc/ceph;
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
        volumeMounts:
        - name: ceph
          mountPath: /mnt/ceph
          readOnly: true
        - name: ceph-conf
          mountPath: /mnt/ceph-conf
          readOnly: true
        - name: conf
          mountPath: /etc/ceph
      - name: setup
        image: ceph/ceph:latest
        command:
        - sh
        - -c
        - |
          set -ex;

          while ! ceph mon dump; do
            echo "Waiting for mon to be ready ...";
            sleep 5;
          done

          mkdir -p /var/lib/ceph/radosgw/ceph-${CEPH_NAME};
          ceph-authtool --create-keyring /var/lib/ceph/radosgw/ceph-${CEPH_NAME}/keyring --gen-key -n client.${CEPH_NAME};
          ceph auth add client.${CEPH_NAME} mon 'allow rw' osd 'allow rwx' -i /var/lib/ceph/radosgw/ceph-${CEPH_NAME}/keyring;
          chown -R 167:167 /var/lib/ceph/radosgw/ceph-${CEPH_NAME};
        env:
        - name: CEPH_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
        volumeMounts:
        - name: conf
          mountPath: /etc/ceph
          readOnly: true
        - name: data
          mountPath: /var/lib/ceph
      containers:
      - name: radosgw
        image: ceph/ceph:latest
        command:
        - radosgw
        args:
        - --foreground
        - --id=$(CEPH_NAME)
        - --setgroup=ceph
        - --setuser=ceph
        env:
        - name: CEPH_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http
          containerPort: 7480
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - curl --silent --show-error --insecure --max-time 5 --output /dev/null https://127.0.0.1:8443/
          periodSeconds: 10
          timeoutSeconds: 6
        resources:
          limits:
            cpu: 300m
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: certs
          mountPath: /etc/ceph-tls
          readOnly: true
        - name: conf
          mountPath: /etc/ceph
          readOnly: true
        - name: data
          mountPath: /var/lib/ceph
          readOnly: true
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: ceph
        hostPath:
          path: /etc/ceph
      - name: ceph-conf
        configMap:
          name: ceph
          items:
          - key: ceph.conf
            path: ceph.conf
      - name: tls
        secret:
          secretName: tls-ceph-radosgw
          defaultMode: 420
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
      - name: certs
        emptyDir:
          medium: Memory
      - name: conf
        emptyDir: {}
      - name: data
        emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: radosgw-tls
    app.kubernetes.io/name: ceph
    app.kubernetes.io/part-of: services
  name: ceph-radosgw-tls-reconcile
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: radosgw-tls
            app.kubernetes.io/name: ceph
            app.kubernetes.io/part-of: services
        spec:
          automountServiceAccountToken: true
          containers:
          - name: reconcile
            image: ceph/ceph:latest
            command:
            - bash
            - /etc/ceph-tls-tools/tls-reconcile.sh
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: scripts
              mountPath: /etc/ceph-tls-tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: ceph-radosgw-tls-reconciler
          volumes:
          - name: scripts
            configMap:
              name: ceph-radosgw-tls
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 16Mi
  schedule: '*/5 * * * *'
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
