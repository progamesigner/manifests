---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: huginn
    app.kubernetes.io/name: huginn
    app.kubernetes.io/part-of: components
  name: huginn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: huginn
      app.kubernetes.io/name: huginn
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: huginn
        app.kubernetes.io/name: huginn
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: migrate
        image: huginn/huginn:latest
        command:
        - alembic
        args:
        - upgrade
        - head
        envFrom:
        - configMapRef:
            name: huginn
        - secretRef:
            name: huginn
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      containers:
      - name: huginn
        image: huginn/huginn:latest
        envFrom:
        - configMapRef:
            name: huginn
        - secretRef:
            name: huginn
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          failureThreshold: 30
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - name: conf
          mountPath: /etc/huginn/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: conf
          mountPath: /etc/huginn/instructions.md
          subPath: instructions.md
          readOnly: true
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: conf
        configMap:
          name: huginn
