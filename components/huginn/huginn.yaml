agents:
  default:
    skills:
      enabled: true
      source: default
    model: gemini/gemma-4-26b-a4b-it
    description: An placeholder agent for general purpose.
    instructions: "You are a helpful assistant"
    tools: &tools
      - name: read_document
      - name: write_document
      - name: websearch
      - name: illustrator
      - name: narrator
    mcp:
    - server: muninn
      allow: &muninn
        - append_diary_entry
        - delete_memory_note
        - edit_memory_note
        - evolve_core_persona
        - list_memory_notes
        - load_session_context
        - read_memory_note
        - read_memory_notes
        - read_note_properties
        - recall_memory_notes
        - rename_memory_note
        - update_note_properties
        - update_task_heartbeat
