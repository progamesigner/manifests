defaults:
  max_completion_tokens: 32768
  model: gemini/gemini-3.5-flash-lite
  provider: bifrost

providers:
  bifrost:
    adapter: openai
    base_url: http://bifrost.default.svc.cluster.local:8080/v1
    api_key:
      value_from:
        env: BIFROST_API_KEY
    models:
    - anthropic/claude-fable-5
    - anthropic/claude-haiku-4-5
    - anthropic/claude-opus-4-8
    - anthropic/claude-opus-5
    - anthropic/claude-sonnet-5
    - gemini/gemini-3.1-pro-preview
    - gemini/gemini-3.5-flash
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-3.6-flash
    - gemini/gemini-3.7-flash
    - gemini/gemma-4-26b-a4b-it
    - gemini/gemma-4-31b-it
    - openai/gpt-5.6-luna
    - openai/gpt-5.6-sol
    - openai/gpt-5.6-terra
    - opencode-go/deepseek-v4-flash
    - opencode-go/deepseek-v4-pro
    - opencode-go/grok-4.5
    - opencode-go/kimi-k3
    - opencode-go/minimax-m3
    - opencode-go/qwen-3.8-max
    - opencode-zen/deepseek-v4-flash
    - opencode-zen/deepseek-v4-pro
    - opencode-zen/glm-5.2
    - opencode-zen/gpt-5.6-luna
    - opencode-zen/gpt-5.6-sol
    - opencode-zen/gpt-5.6-terra
    - opencode-zen/grok-4.5
    - opencode-zen/kimi-k3
    - opencode-zen/minimax-m3
    - opencode-zen/nemotron-3-ultra-free
    - opencode-zen/qwen3.6-plus
    - openrouter/deepseek/deepseek-v4-flash-0731
    - openrouter/google/gemma-2-27b-it
    - openrouter/moonshotai/kimi-k3
    - openrouter/nvidia/nemotron-3-ultra-550b-a55b
    - openrouter/openai/gpt-oss-120b
    - openrouter/tencent/hy4-preview
    - openrouter/x-ai/grok-4.6
    - openrouter/xiaomi/mimo-v2.5
    - openrouter/z-ai/glm-5.2
    - openrouter/z-ai/glm-5.3-flash
    cache_control:
    - anthropic/claude-fable-5
    - anthropic/claude-haiku-4-5
    - anthropic/claude-opus-4-8
    - anthropic/claude-opus-5
    - anthropic/claude-sonnet-5

tools:
  websearch:
    kind: websearch
    api_key:
      value_from:
        env: FELO_API_KEY

mcp_servers:
  muninn:
    transport: http
    url: http://muninn.default.svc.cluster.local:8000/mcp
    auth:
      value_from:
        env: MUNINN_MCP_TOKEN
  twinkle:
    transport: http
    url: https://api.twinkleai.tw/mcp
    auth:
      value_from:
        env: TWINKLE_MCP_TOKEN
  twstock:
    transport: http
    url: https://TW-Stock-MCP-Server.fastmcp.app/mcp

transcription:
  kind: openai
  model: openai/gpt-4o-mini-transcribe
  api_key:
    value_from:
      env: OPENAI_API_KEY

agents:
  default:
    model: gemini/gemma-4-26b-a4b-it
    description: An placeholder agent for general purpose.
    instructions_file: /etc/huginn/instructions.md
    tools: &tools
    - name: websearch
    mcp:
    - server: muninn
      allow: &muninn
      - append_diary_entry
      - delete_memory_note
      - edit_memory_note
      - evolve_core_persona
      - list_memory_notes
      - load_session_context
      - read_memory_note
      - read_memory_notes
      - read_note_properties
      - recall_memory_notes
      - rename_memory_note
      - update_note_properties
      - update_task_heartbeat
      - write_memory_note
      - write_memory_notes
  advisor-fast:
    description: Handles quick budget calculations, price comparisons, and straightforward low-risk financial questions.
    model: openai/gpt-5.6-luna
    instructions_file: /etc/huginn/instructions.md
    tools: *tools
    mcp:
    - &advisor-muninn
      server: muninn
      allow: *muninn
      inject:
        agent: ${MUNINN_ADVISOR_SCOPE_AGENT}
        user: ${MUNINN_ADVISOR_SCOPE_USER}
    - &advisor-twstock
      server: twstock
      allow:
      - get_abnormal_accumulated_noti
      - get_all_stocks_daily_close
      - get_company_balance_shee
      - get_company_dividen
      - get_company_eps_statistic
      - get_company_income_statemen
      - get_company_major_new
      - get_company_monthly_revenu
      - get_company_profil
      - get_company_profitability_analysi
      - get_daily_day_trading_target
      - get_dividend_rights_schedul
      - get_etf_regular_investment_ranking
      - get_foreign_holdings_history
      - get_margin_balance
      - get_margin_loan_restrictions_
      - get_market_disposal_stocks
      - get_market_gain_loss_statist
      - get_market_index_info
      - get_market_institutional_amo
      - get_market_turnover_history
      - get_market_valuation_by_date
      - get_otc_daily
      - get_otc_disposal_stocks
      - get_otc_exright
      - get_otc_index
      - get_otc_institutional
      - get_otc_margin_balance
      - get_otc_valuation
      - get_otc_warning_stocks
      - get_realtime_quote
      - get_securities_trading_changes
      - get_short_sale_lending_balance_history
      - get_stock_daily_trading
      - get_stock_history
      - get_stock_monthly_avg_history
      - get_stock_monthly_history
      - get_stock_valuation_ratios
      - get_stock_yearly_history
      - get_suspended_trading_stocks
      - get_taiex_index_history
      - get_today_notice_stocks
      - get_top_20_volume_stocks
      - get_twse_institutional_invest
      - get_twse_institutional_investors_summary
  advisor-balanced:
    description: Handles routine cash-flow planning, project cost estimates, portfolio reviews, and multi-step financial comparisons.
    model: openai/gpt-5.6-terra
    instructions_file: /etc/huginn/instructions.md
    tools: *tools
    mcp:
    - *advisor-muninn
    - *advisor-twstock
  advisor-advanced:
    description: Handles high-impact financial decisions with uncertainty, competing scenarios, risk analysis, and long-term tradeoffs.
    model: openai/gpt-5.6-sol
    instructions_file: /etc/huginn/instructions.md
    tools: *tools
    mcp:
    - *advisor-muninn
    - *advisor-twstock
  architect-fast:
    description: Produces quick API sketches, component choices, and focused technology recommendations for bounded problems.
    model: anthropic/claude-haiku-4-5
    instructions_file: /etc/huginn/instructions.md
    tools: *tools
    mcp:
    - &architect-muninn
      server: muninn
      allow: *muninn
      inject:
        agent: ${MUNINN_ARCHITECT_SCOPE_AGENT}
        user: ${MUNINN_ARCHITECT_SCOPE_USER}
  architect-balanced:
    description: Designs system boundaries, data flows, APIs, technology tradeoffs, and realistic implementation timelines.
    model: anthropic/claude-sonnet-5
    instructions_file: /etc/huginn/instructions.md
    tools: *tools
    mcp:
    - *architect-muninn
  architect-advanced:
    description: Handles distributed architecture, migrations, failure and threat models, complex tradeoffs, and architecture decisions.
    model: anthropic/claude-opus-5
    instructions_file: /etc/huginn/instructions.md
    tools: *tools
    mcp:
