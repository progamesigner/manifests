      server: muninn
      allow: *muninn
      inject:
        agent: ${MUNINN_ASSISTANT_SCOPE_AGENT}
        user: ${MUNINN_ASSISTANT_SCOPE_USER}
  assistant-balanced:
    description: Organizes multi-step errands, information, notes, schedules, and routine tool-assisted workflows.
    model: openai/gpt-5.6-terra
    instructions_file: /etc/huginn/instructions.md
