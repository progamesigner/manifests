        - write_memory_notes
  advisor-fast:
    skills:
      enabled: true
      source: advisor
    description: Handles quick budget calculations, price comparisons, and straightforward low-risk financial questions.
    model: openai/gpt-6-luna
    instructions: ''
    tools: *tools
    hooks:
    - advisor-session-context
    mcp:
    - &advisor-muninn
      server: muninn
      allow: *muninn
      inject:
        agent: ${MUNINN_ADVISOR_SCOPE_AGENT}
      bind:
        user: memory_scope
    - &advisor-twstock
      server: twstock
      allow:
      - get_abnormal_accumulated_noti
      - get_all_stocks_daily_close
      - get_company_balance_shee
      - get_company_dividen
      - get_company_eps_statistic
