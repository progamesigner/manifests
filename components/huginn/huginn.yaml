defaults:
  max_completion_tokens: 32768
  max_iterations: 10
  turn_timeout: 300
  model: gemini/gemini-3.5-flash-lite
  provider: bifrost

providers:
  bifrost:
    adapter: openai
    base_url: http://bifrost.default.svc.cluster.local:8080/v1
    api_key:
      value_from:
        env: BIFROST_API_KEY
    models:
    - anthropic/claude-fable-5-1
    - anthropic/claude-haiku-5-5
    - anthropic/claude-opus-5-5
    - anthropic/claude-sonnet-5-5
    - gemini/gemini-3.1-pro-preview
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-3.8-flash
    - gemini/gemma-4-26b-a4b-it
    - gemini/gemma-4-31b-it
    - openai/gpt-5.6-terra
    - openai/gpt-6-astra
    - openai/gpt-6-luna
    - openai/gpt-6.1-sol
    - xai/grok-4.7
    - openrouter/deepseek/deepseek-v4.1-flash
    - openrouter/moonshotai/kimi-k3
    - openrouter/nvidia/nemotron-3-ultra-550b-a55b
    - openrouter/openai/gpt-oss-120b
    - openrouter/tencent/hy4-preview
    - openrouter/xiaomi/mimo-v2.6-flash
    - openrouter/xiaomi/mimo-v2.6-pro
    - openrouter/z-ai/glm-5.3
    vision:
    - anthropic/claude-fable-5-1
    - anthropic/claude-haiku-5-5
    - anthropic/claude-opus-5-5
    - anthropic/claude-sonnet-5-5
    - gemini/gemini-3.1-pro-preview
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-3.8-flash
    - gemini/gemma-4-26b-a4b-it
    - gemini/gemma-4-31b-it
    - openai/gpt-5.6-terra
    - openai/gpt-6-astra
    - openai/gpt-6-luna
    - openai/gpt-6.1-sol
    - xai/grok-4.7
    - openrouter/deepseek/deepseek-v4.1-flash
    - openrouter/moonshotai/kimi-k3
    - openrouter/xiaomi/mimo-v2.6-flash
    - openrouter/xiaomi/mimo-v2.6-pro
    documents:
    - anthropic/claude-fable-5-1
    - anthropic/claude-haiku-5-5
    - anthropic/claude-opus-5-5
    - anthropic/claude-sonnet-5-5
    - gemini/gemini-3.1-pro-preview
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-3.8-flash
    - openai/gpt-5.6-terra
    - openai/gpt-6-astra
    - openai/gpt-6-luna
    - openai/gpt-6.1-sol
    - xai/grok-4.7
    cache_control:
    - anthropic/claude-fable-5-1
    - anthropic/claude-haiku-5-5
    - anthropic/claude-opus-5-5
    - anthropic/claude-sonnet-5-5
  jev:
    type: decision
    adapter: bifrost
    url: http://bifrost.default.svc.cluster.local:8080/v1/decisions
    api_key:
      value_from:
        env: BIFROST_API_KEY
    models:
    - typesafe/jev-1.13.0
    timeout: 3.0

tools:
  read_document:
    kind: read_document
  write_document:
    kind: write_document
    description: Write a Markdown, CSV, Word or Excel file for the user to download.
  websearch:
    kind: websearch
    api_key:
      value_from:
        env: FELO_API_KEY
  illustrator:
    kind: images
    description: Draw an image the user asked for; it is sent to them directly.
    model: openai/gpt-image-2.5-sunburst
    base_url: http://bifrost.default.svc.cluster.local:8080
    api_key:
      value_from:
        env: BIFROST_API_KEY
    size: 1024x1024
  narrator:
    kind: speech
    description: Read a short answer aloud as a voice message.
    model: openai/gpt-4o-mini-tts-2025-12-15
    base_url: http://bifrost.default.svc.cluster.local:8080
    voice: alloy
    format: opus
    api_key:
      value_from:
        env: BIFROST_API_KEY

mcp_servers:
  muninn:
    transport: http
    url: http://muninn.default.svc.cluster.local:8000/mcp
    auth:
      value_from:
        env: MUNINN_MCP_TOKEN
  twinkle:
    transport: http
    url: https://api.twinkleai.tw/mcp
    auth:
      value_from:
        env: TWINKLE_MCP_TOKEN
  twstock:
    transport: http
    url: https://TW-Stock-MCP-Server.fastmcp.app/mcp

hooks:
  advisor-session-context:
    kind: mcp
    server: muninn
    tool: load_session_context
    arguments:
      agent: ${MUNINN_ADVISOR_SCOPE_AGENT}
    bind:
      user: memory_scope
    cache_ttl: 600
  architect-session-context:
    kind: mcp
    server: muninn
