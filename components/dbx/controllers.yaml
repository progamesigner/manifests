---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: dbx
    app.kubernetes.io/name: dbx
    app.kubernetes.io/part-of: components
  name: dbx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dbx
      app.kubernetes.io/name: dbx
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dbx
        app.kubernetes.io/name: dbx
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dbx
        image: dbx/dbx:latest
        env:
        - name: DBX_DISABLE_PASSWORD
          value: 'true'
        ports:
        - name: http
          containerPort: 4224
        livenessProbe:
          httpGet:
            path: /api/auth/check
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/auth/check
            port: http
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/auth/check
            port: http
          failureThreshold: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dbx
