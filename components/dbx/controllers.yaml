---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: dbx
    app.kubernetes.io/name: dbx
    app.kubernetes.io/part-of: components
  name: dbx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dbx
      app.kubernetes.io/name: dbx
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dbx
        app.kubernetes.io/name: dbx
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dbx
        image: dbx/dbx:latest
        env:
        - name: DBX_DISABLE_PASSWORD
          value: 'true'
        ports:
        - name: http
          containerPort: 4224
        livenessProbe:
          httpGet:
            path: /api/auth/check
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/auth/check
            port: http
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/auth/check
            port: http
          failureThreshold: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
      - name: tailscale
        image: network/tailscale:latest
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: ''
        - name: KUBERNETES_SERVICE_PORT
          value: ''
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-app-connector
              key: TS_AUTHKEY
        - name: TS_ENABLE_HEALTH_CHECK
          value: 'true'
        - name: TS_EXTRA_ARGS
          valueFrom:
            secretKeyRef:
              name: tailscale-app-connector
              key: TS_EXTRA_ARGS
        - name: TS_KUBE_SECRET
          value: ''
        - name: TS_USERSPACE
          value: 'false'
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9002
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            drop:
            - ALL
          privileged: true
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dbx
