---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: cloudflare-warp
    app.kubernetes.io/name: proxy
    app.kubernetes.io/part-of: components
  name: cloudflare-warp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cloudflare-warp
      app.kubernetes.io/name: proxy
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cloudflare-warp
        app.kubernetes.io/name: proxy
        app.kubernetes.io/part-of: components
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      automountServiceAccountToken: false
      containers:
      - name: cloudflare-warp
        image: network/cloudflare-warp:latest
        env:
        - name: GOST_ARGS
          value: -L :1080 -L :8080
        - name: WARP_SLEEP
          value: '2'
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - curl -fsS --max-time 5 -x http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace | grep -qE "warp=(on|plus)"
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - curl -fsS --max-time 5 -x http://127.0.0.1:8080 https://www.cloudflare.com/cdn-cgi/trace | grep -qE "warp=(on|plus)"
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 10
        ports:
        - name: socks
          containerPort: 1080
        - name: proxy
          containerPort: 8080
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
      enableServiceLinks: false
      serviceAccountName: default
