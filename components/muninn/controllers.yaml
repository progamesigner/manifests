---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: muninn
    app.kubernetes.io/name: muninn
    app.kubernetes.io/part-of: components
  name: muninn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: muninn
      app.kubernetes.io/name: muninn
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: muninn
        app.kubernetes.io/name: muninn
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      containers:
      - name: muninn
        image: muninn/muninn:latest
        env:
        - name: MUNINN_HTTP_ALLOWED_HOSTS
          valueFrom:
            secretKeyRef:
              name: muninn
              key: MUNINN_HTTP_ALLOWED_HOSTS
        - name: MUNINN_HTTP_TOKENS_FILE
          value: /etc/muninn/tokens.json
        - name: MUNINN_RECALL_BACKEND
          value: tantivy
        - name: MUNINN_RECALL_INDEX_DIR
          value: /var/lib/muninn/index
        ports:
        - name: mcp
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: /readyz
            port: 8000
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 8Gi
          requests:
            cpu: 300m
            memory: 512Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        volumeMounts:
        - name: cache
          mountPath: /var/lib/muninn/index
        - name: data
          mountPath: /vault
        - name: cred
          mountPath: /etc/muninn/tokens.json
          subPath: tokens.json
          readOnly: true
      - name: obsidian
        image: obsidian/obsidian-sync:latest
        env:
        - name: DEVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: muninn
              key: OBSIDIAN_DEVICE_NAME
        - name: OBSIDIAN_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: muninn
              key: OBSIDIAN_AUTH_TOKEN
        - name: PGID
          value: '1000'
        - name: PUID
          value: '1000'
        - name: VAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: muninn
              key: OBSIDIAN_VAULT_PASSWORD
        - name: VAULT_NAME
          valueFrom:
            secretKeyRef:
              name: muninn
              key: OBSIDIAN_VAULT_NAME
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 300m
            memory: 128Mi
        volumeMounts:
        - name: conf
          mountPath: /home/obsidian/.config
        - name: data
          mountPath: /vault
      - name: webdav
        image: rclone/rclone:latest
        args:
        - serve
        - webdav
        - /vault
        - --addr=:8080
        ports:
        - name: webdav
          containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 300m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /vault
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      serviceAccountName: default
      volumes:
      - name: cache
        emptyDir:
          sizeLimit: 32Gi
      - name: conf
        persistentVolumeClaim:
          claimName: obsidian-config
      - name: cred
        secret:
          secretName: muninn
      - name: data
        persistentVolumeClaim:
          claimName: obsidian
