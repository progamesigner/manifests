---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: freya
    app.kubernetes.io/name: sleipnir
    app.kubernetes.io/part-of: components
  name: sleipnir-freya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: freya
      app.kubernetes.io/name: sleipnir
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: freya
        app.kubernetes.io/name: sleipnir
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: setup
        image: sleipnir/sleipnir:latest
        command:
        - sh
        - -c
        - set -ex;

          mkdir -p /mnt/dev-conf-zsh && touch /mnt/dev-conf-zsh/.zshenv;

          install -d -o ubuntu -g ubuntu -m 0755 /mnt/dev-data-serenal;
        volumeMounts:
        - name: data
          mountPath: /mnt
      containers:
      - name: sleipnir
        image: sleipnir/sleipnir:latest
        envFrom:
        - configMapRef:
            name: sleipnir
        - secretRef:
            name: sleipnir-freya
        ports:
        - name: moshi
          containerPort: 24544
          protocol: TCP
        resources:
          limits:
            cpu: 4000m
            memory: 32Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
        volumeMounts:
        - name: data
          mountPath: /home/ubuntu/.config/gh
          subPath: dev-conf-github
        - name: data
          mountPath: /home/ubuntu/.gnupg
          subPath: dev-conf-gpg
        - name: data
          mountPath: /home/ubuntu/.config/herdr
          subPath: dev-conf-herdr
        - name: data
          mountPath: /home/ubuntu/.config/moshi
          subPath: dev-conf-moshi
        - name: data
          mountPath: /home/ubuntu/.config/opencode
          subPath: dev-conf-opencode
        - name: data
          mountPath: /home/ubuntu/.ssh
          subPath: dev-conf-ssh
        - name: data
          mountPath: /home/ubuntu/.zshenv
          subPath: dev-conf-zsh/.zshenv
        - name: data
          mountPath: /home/ubuntu/.agents
          subPath: dev-data-agents
        - name: data
          mountPath: /home/ubuntu/.local/bin
          subPath: dev-data-bin
        - name: data
          mountPath: /home/ubuntu/.claude
          subPath: dev-data-claude
        - name: data
          mountPath: /home/ubuntu/.local/share/claude
          subPath: dev-data-claude-code
        - name: data
          mountPath: /home/ubuntu/.codex
          subPath: dev-data-codex
        - name: data
          mountPath: /home/ubuntu/.copilot
          subPath: dev-data-copilot
        - name: data
          mountPath: /home/ubuntu/.gemini
          subPath: dev-data-gemini
        - name: data
          mountPath: /home/ubuntu/.local/state/moshi
          subPath: dev-data-moshi
        - name: data
          mountPath: /usr/local/npm
          subPath: dev-data-npm
        - name: data
          mountPath: /home/ubuntu/.local/share/opencode
          subPath: dev-data-opencode
        - name: data
          mountPath: /home/ubuntu/.serena
          subPath: dev-data-serena
        - name: data
          mountPath: /var/lib/tailscale
          subPath: dev-data-tailscale
        - name: data
          mountPath: /usr/local/uv
          subPath: dev-data-uv
        - name: data
          mountPath: /home/ubuntu/.vscode-cli
          subPath: dev-data-vscode
        - name: data
          mountPath: /home/ubuntu/.vscode-server
          subPath: dev-data-vscode-server
        - name: files
          mountPath: /workspace
      enableServiceLinks: false
      hostname: sleipnir
      securityContext:
        fsGroup: 1000
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sleipnir-folkvangr
      - name: files
        persistentVolumeClaim:
          claimName: sleipnir-freya
