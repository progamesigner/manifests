---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: urd
    app.kubernetes.io/name: sleipnir
    app.kubernetes.io/part-of: components
  name: sleipnir-urd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
    app.kubernetes.io/component: urd
    app.kubernetes.io/name: sleipnir
    app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
    app.kubernetes.io/component: urd
    app.kubernetes.io/name: sleipnir
    app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      containers:
      - name: sleipnir
        image: sleipnir/sleipnir:latest
        imagePullPolicy: Always
        env:
        - name: TS_HOSTNAME
          value: "sleipnir-urd"
        - name: CODE_TUNNEL_NAME
          value: "sleipnir-urd"
        - name: CLAUDE_RC_NAME
          value: "Sleipnir Urd"
        - name: CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX
          value: "Sleipnir Urd"
        - name: SLEIPNIR_ENABLE_RC_CLAUDE
          value: "1"
        - name: SLEIPNIR_ENABLE_RC_CODEX
          value: "1"
        envFrom:
        - secretRef:
            name: sleipnir-urd
        ports:
        - name: moshi-web
          containerPort: 24544
        resources:
          limits:
            cpu: 4000m
            memory: 12Gi
          requests:
            cpu: 1000m
            memory: 4Gi
        # s6-overlay supervises as root and drops every service to uid 1000 with
        # s6-setuidgid, so the container itself cannot run as non-root here.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: claude
          mountPath: /home/ubuntu/.claude
        - name: codex
          mountPath: /home/ubuntu/.codex
        - name: gemini
          mountPath: /home/ubuntu/.gemini
        - name: copilot
          mountPath: /home/ubuntu/.copilot
        - name: github
          mountPath: /home/ubuntu/.config/gh
        - name: opencode-conf
          mountPath: /home/ubuntu/.config/opencode
        - name: opencode-data
          mountPath: /home/ubuntu/.local/share/opencode
        - name: herdr
          mountPath: /home/ubuntu/.config/herdr
        - name: moshi-conf
          mountPath: /home/ubuntu/.config/moshi
        - name: moshi-state
          mountPath: /home/ubuntu/.local/state/moshi
        - name: local-bin
          mountPath: /home/ubuntu/.local/bin
        - name: vscode
          mountPath: /home/ubuntu/.vscode-cli
        - name: tailscale
          mountPath: /var/lib/tailscale
        - name: workspace
          mountPath: /workspace
      enableServiceLinks: false
      hostname: sleipnir-urd
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
      serviceAccountName: default
      volumes:
      - name: claude
        persistentVolumeClaim:
          claimName: sleipnir-urd-claude
      - name: codex
        persistentVolumeClaim:
          claimName: sleipnir-urd-codex
      - name: gemini
        persistentVolumeClaim:
          claimName: sleipnir-urd-gemini
      - name: copilot
        persistentVolumeClaim:
          claimName: sleipnir-urd-copilot
      - name: github
        persistentVolumeClaim:
          claimName: sleipnir-urd-github
      - name: opencode-conf
        persistentVolumeClaim:
          claimName: sleipnir-urd-opencode-conf
      - name: opencode-data
        persistentVolumeClaim:
          claimName: sleipnir-urd-opencode-data
      - name: herdr
        persistentVolumeClaim:
          claimName: sleipnir-urd-herdr
      - name: moshi-conf
        persistentVolumeClaim:
          claimName: sleipnir-urd-moshi-conf
      - name: moshi-state
        persistentVolumeClaim:
          claimName: sleipnir-urd-moshi-state
      - name: local-bin
        persistentVolumeClaim:
          claimName: sleipnir-urd-local-bin
      - name: vscode
        persistentVolumeClaim:
          claimName: sleipnir-urd-vscode
      - name: tailscale
        persistentVolumeClaim:
          claimName: sleipnir-urd-tailscale
      - name: workspace
        persistentVolumeClaim:
          claimName: sleipnir-urd-workspace
