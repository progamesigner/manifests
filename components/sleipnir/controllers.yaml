---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: sleipnir
    app.kubernetes.io/name: sleipnir
    app.kubernetes.io/part-of: components
  name: sleipnir
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: sleipnir
      app.kubernetes.io/name: sleipnir
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sleipnir
        app.kubernetes.io/name: sleipnir
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: setup
        image: sleipnir/sleipnir:latest
        command:
        - sh
        - -c
        - |
          set -ex;

          install -d -o ubuntu -g ubuntu -m 0700 /mnt/ssh
          install -o ubuntu -g ubuntu -m 0600 /config/ssh /mnt/ssh/config
        volumeMounts:
        - name: conf
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /mnt
      containers:
      - name: sleipnir
        image: sleipnir/sleipnir:latest
        envFrom:
        - configMapRef:
            name: sleipnir
        - secretRef:
            name: sleipnir
        env:
        - name: MOSHI_LISTEN
          value: 0.0.0.0:24544
        - name: SLEIPNIR_ENABLE_HERDR
          value: '0'
        - name: SLEIPNIR_ENABLE_MOSHI
          value: '1'
        - name: SLEIPNIR_ENABLE_TAILSCALE
          value: '1'
        - name: SLEIPNIR_TAILSCALE_TUN
          value: userspace-networking
        ports:
        - name: moshi
          containerPort: 24544
          protocol: TCP
        livenessProbe:
          tcpSocket:
            port: moshi
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: moshi
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          tcpSocket:
            port: moshi
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /home/ubuntu/.ssh
          subPath: ssh
        - name: data
          mountPath: /var/lib/tailscale
          subPath: tailscale
      enableServiceLinks: false
      hostname: sleipnir
      securityContext:
        fsGroup: 1000
      serviceAccountName: default
      volumes:
      - name: conf
        secret:
          secretName: sleipnir
      - name: data
        persistentVolumeClaim:
          claimName: sleipnir
---
