---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: components
  name: seafile-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: seafile
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/name: seafile
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: true
      initContainers:
      - name: chown
        image: busybox:latest
        command:
        - sh
        - -c
        - set -ex;

          chown -R 8000:8000 /shared;
          chmod -R a+rwx /shared;
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
        volumeMounts:
        - name: data
          mountPath: /shared
      - name: setup
        image: seafile/backend:latest
        command:
        - sh
        - -c
        - |
          set -eu;

          while :; do
            if [ -n "$TLS_CONTENT_SHA256" ] && cp /mnt/ceph-ca/ca.crt /usr/local/share/ca-certificates/ceph-radosgw.crt; then
              actual=$(sha256sum /usr/local/share/ca-certificates/ceph-radosgw.crt | cut -d ' ' -f 1);
              [ "$actual" != "$TLS_CONTENT_SHA256" ] || break;
            fi
            sleep 5;
          done;
          update-ca-certificates;
          printf '%s\n' "$actual" > /etc/ssl/certs/ceph-radosgw-ca.sha256;
        env:
        - name: TLS_CONTENT_SHA256
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['tls.progamesigner.dev/content-sha256']
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
        volumeMounts:
        - name: ca
          mountPath: /mnt/ceph-ca
          readOnly: true
        - name: certs
          mountPath: /etc/ssl/certs
      containers:
      - name: seafile
        image: seafile/backend:latest
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pgrep -x seaf-server && pgrep -x fileserver
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        env:
        - name: AWS_CA_BUNDLE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: CLUSTER_MODE
          value: 'backend'
        - name: CLUSTER_SERVER
          value: 'true'
        - name: SEAFILE_LOG_TO_STDOUT
          value: 'true'
        - name: TIME_ZONE
          value: UTC
        envFrom:
        - configMapRef:
            name: seafile
        - secretRef:
            name: seafile
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: conf
          mountPath: /etc/clamav/clamd.conf
          subPath: clamd.conf
        - name: data
          mountPath: /shared
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: ca
        configMap:
          name: tls-ceph-radosgw-client-trust
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
      - name: certs
        emptyDir: {}
      - name: conf
        configMap:
          name: seafile
          items:
          - key: clamd.conf
            path: clamd.conf
      - name: data
        persistentVolumeClaim:
          claimName: seafile
---
