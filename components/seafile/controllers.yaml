        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: seafile
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: true
      initContainers:
      - name: setup
        image: seafile/frontend:latest
        command:
        - sh
        - -c
        - |
          set -eu;

          while :; do
            if [ -n "$TLS_CONTENT_SHA256" ] && cp /mnt/ceph-ca/ca.crt /usr/local/share/ca-certificates/ceph-radosgw.crt; then
              actual=$(sha256sum /usr/local/share/ca-certificates/ceph-radosgw.crt | cut -d ' ' -f 1);
              [ "$actual" != "$TLS_CONTENT_SHA256" ] || break;
            fi
            sleep 5;
          done;
          update-ca-certificates;
          printf '%s\n' "$actual" > /etc/ssl/certs/ceph-radosgw-ca.sha256;
        env:
        - name: TLS_CONTENT_SHA256
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['tls.progamesigner.dev/content-sha256']
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
        volumeMounts:
        - name: ca
          mountPath: /mnt/ceph-ca
          readOnly: true
        - name: certs
          mountPath: /etc/ssl/certs
      containers:
      - name: seafile
        image: seafile/frontend:latest
        env:
        - name: AWS_CA_BUNDLE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: CLUSTER_MODE
          value: 'frontend'
        - name: CLUSTER_SERVER
          value: 'true'
        - name: SEAFILE_LOG_TO_STDOUT
          value: 'true'
        - name: TIME_ZONE
          value: UTC
        envFrom:
        - configMapRef:
            name: seafile
        - secretRef:
            name: seafile
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: seafile
          containerPort: 8000
          protocol: TCP
        - name: seafdav
          containerPort: 8080
          protocol: TCP
        - name: seafhttp
          containerPort: 8082
          protocol: TCP
        readinessProbe:
          httpGet:
            httpHeaders:
            - name: Host
              value: localhost
            path: /api2/ping/
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          limits:
            cpu: 4000m
            memory: 16Gi
          requests:
            cpu: 300m
            memory: 512Mi
        volumeMounts:
        - name: certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: conf
          mountPath: /etc/clamav/clamd.conf
          subPath: clamd.conf
        - name: data
          mountPath: /shared
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: ca
        configMap:
          name: tls-ceph-radosgw-client-trust
          defaultMode: 420
          items:
          - key: ca.crt
            path: ca.crt
      - name: certs
        emptyDir: {}
      - name: conf
        configMap:
          name: seafile
          items:
          - key: clamd.conf
            path: clamd.conf
      - name: data
        persistentVolumeClaim:
          claimName: seafile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: notification
    app.kubernetes.io/name: seafile
    app.kubernetes.io/part-of: components
  name: seafile-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: notification
      app.kubernetes.io/name: seafile
      app.kubernetes.io/part-of: components
  template:
    metadata:
      labels:
        app.kubernetes.io/component: notification
        app.kubernetes.io/name: seafile
        app.kubernetes.io/part-of: components
    spec:
      automountServiceAccountToken: true
      containers:
      - name: seafile
        image: seafile/notification:latest
        env:
        - name: NOTIFICATION_SERVER_LOG_LEVEL
          value: info
        - name: SEAFILE_LOG_TO_STDOUT
          value: 'true'
        - name: TIME_ZONE
          value: UTC
        envFrom:
        - configMapRef:
            name: seafile
        - secretRef:
            name: seafile-notification
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /shared/seafile/logs
          subPath: seafile/logs
      enableServiceLinks: false
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: seafile
